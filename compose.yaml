name: hcblk

services:
  server:
    tty: true
    build:
      context: .
      args:
        PORT: 8080
    ports:
      - 3000:8080
    volumes:
      - logs:/var/log/hcblk/
      - db:/app/assets/db/
      - dist:/app/assets/dist/

volumes:
  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/logs/
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/db/
  dist:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./assets/dist/

